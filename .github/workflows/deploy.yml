name: Deploy to GitHub Pages

# Deploys the built Vite app to GitHub Pages on every push to `main`.
#
# URL: https://idiolect.dev/fieldwork/
#
# How the custom-domain routing works:
#
# 1. `idiolect-dev/idiolect-dev.github.io` is the org's user site and
#    has its custom domain set to `idiolect.dev` in its Pages settings.
# 2. Per GitHub's docs, when an org sets a custom domain on its
#    user/org site, that domain is inherited by every project Pages
#    site in the org at the corresponding subpath. So
#    `idiolect-dev/fieldwork`'s Pages site automatically serves at
#    `https://idiolect.dev/fieldwork/` with no CNAME file needed.
# 3. Vite is configured (see `app/vite.config.ts`) with
#    `base: "/fieldwork/"` in production so asset URLs are prefixed
#    correctly.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: ./scripts/build-wasm.sh
      - working-directory: app
        run: npm install
      - working-directory: app
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
