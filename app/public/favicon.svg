<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Index-card / field-notebook icon: a cream card on a dark
       background, with a colored tab at the top edge and two ruled
       lines suggesting recorded entries. -->
  <rect width="64" height="64" rx="12" fill="#1c1917"/>
  <!-- card body -->
  <rect x="12" y="14" width="40" height="38" rx="3" fill="#f1eee9"/>
  <!-- top tab (curator-orange) -->
  <rect x="22" y="10" width="20" height="8" rx="2" fill="#e8a020"/>
  <!-- rule lines suggesting entries -->
  <rect x="18" y="28" width="28" height="2" rx="1" fill="#d6cfbe"/>
  <rect x="18" y="36" width="22" height="2" rx="1" fill="#d6cfbe"/>
  <rect x="18" y="44" width="18" height="2" rx="1" fill="#d6cfbe"/>
</svg>
